[project]
name = "deephpose"
version = "0.1.0"
description = "Profundidad FoundationStereo + RealSense D415"
requires-python = "==3.11.*"
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "xformers",
  "opencv-contrib-python",
  "flash-attn",
  "timm>=1.0.30",
  "omegaconf>=2.3.1",
  "imageio>=2.38.0",
  "open3d>=0.20.0",
  "trimesh>=5.1.1",
  "joblib>=1.6.0",
  "pandas>=3.0.6",
  "huggingface-hub>=2.1.1",
  "pyyaml>=6.0.3",
  "scipy>=1.17.1",
  "pyrealsense2>=2.58.4.10922",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
xformers = [{ index = "pytorch-cu124" }]
flash-attn = { url = "https://github.com/kingbri1/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu124torch2.6.0cxx11abiFALSE-cp311-cp311-win_amd64.whl" }

[tool.uv]
package = false
