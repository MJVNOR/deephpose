[project]
name = "deephpose-pose"
version = "0.1.0"
description = "Pose 6D FoundationPose (model-based). Mismo torch que deephpose, env separado."
requires-python = "==3.11.*"
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "numpy>=2",
  "scipy",
  "opencv-python",
  "open3d>=0.20.0",
  "trimesh>=5.1.1",
  "kornia>=0.7",
  "ruamel.yaml>=0.18",
  "pyyaml>=6.0.3",
  "imageio>=2.38.0",
  "pillow",
  "matplotlib",
  "psutil",
  "tqdm",
  "joblib>=1.6.0",
  "ninja>=1.13.2",
  "setuptools>=84.0.0",
  "pybind11>=3.1.0",
  "pandas>=3.0.6",
  "scikit-learn>=1.9.1",
  "transformations>=2026.1.18",
  "omegaconf>=2.3.1",
  "h5py>=3.16.0",
  "warp-lang==1.8.0",
  "pyrealsense2>=2.58.4.10922",
  "timm>=1.0.30",
  "einops>=0.8.2",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[tool.uv]
package = false
