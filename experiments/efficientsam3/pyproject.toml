[project]
name = "deephmeasure-efficientsam3-evaluation"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "efficientsam3", "torch==2.7.1", "torchvision==0.22.1",
  "opencv-python", "scipy", "einops", "pycocotools", "hydra-core",
  "matplotlib", "triton-windows>=3.3,<3.4", "psutil",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
efficientsam3 = { path = "../../third_party/EfficientSAM3", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
